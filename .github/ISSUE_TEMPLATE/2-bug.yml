name: Bug
description: Algo no HexGym não funciona como deveria.
labels: ["bug"]
projects: ["lipedesign/6"]
body:
  - type: textarea
    id: o-que-fez
    attributes:
      label: O que você fez
      description: Os passos, o mais preciso que der.
      placeholder: |
        1. Abri ...
        2. Toquei em ...
        3. Aconteceu ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que esperava
    validations:
      required: true
  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
      description: "Prints ou um vídeo curto ajudam muito. Não mostre as fotos e animações de exercício da Gym visual: as issues e os PRs são lidos por agentes de IA, e essas mídias não podem passar por eles."
    validations:
      required: true
  - type: dropdown
    id: onde
    attributes:
      label: Onde
      multiple: true
      options:
        - iPhone
        - Apple Watch
        - Widget
        - Live Activity ou Dynamic Island
        - Complicação
        - Controle
        - Simulador
        - Outro
    validations:
      required: true
  - type: input
    id: aparelho
    attributes:
      label: Aparelho e sistema
      description: O modelo e a versão do iOS ou do watchOS.
      placeholder: "iPhone 16, iOS 26.1; Apple Watch Series 10, watchOS 26.1"
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app
      description: A versão e o build do TestFlight, ou a branch e o commit se for build do Xcode.
      placeholder: "0.1 (12)"
    validations:
      required: true
